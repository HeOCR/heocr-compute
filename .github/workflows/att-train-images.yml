name: Publish arm ATT CUDA training workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which worker to publish
        required: true
        type: choice
        options:
          - att-parseq-train-cuda
          - att-paddle-train-cuda

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'HeOCR/heocr-compute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      IMAGE: ghcr.io/heocr/heocr-compute-train
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Free runner disk for the CUDA wheels
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Prepare the committed build inputs
        run: |
          case "$TARGET" in
            att-parseq-train-cuda) dockerfile=docker/att-parseq-train.Dockerfile; req=experiments/att/requirements-parseq-linux.txt ;;
            att-paddle-train-cuda) dockerfile=docker/att-paddle-train.Dockerfile; req=experiments/att/requirements-paddle-linux.txt ;;
            *) echo "unknown target $TARGET" >&2; exit 2 ;;
          esac
          context="$RUNNER_TEMP/att-image"
          mkdir "$context"
          git archive "$GITHUB_SHA" "$dockerfile" "$req" | tar -x -C "$context"
          test -s "$context/$req"
          printf 'DOCKERFILE=%s\n' "$dockerfile" >> "$GITHUB_ENV"
      - name: Build Linux AMD64 image
        run: |
          docker buildx build --platform linux/amd64 --file "$RUNNER_TEMP/att-image/$DOCKERFILE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance=false --sbom=false --load --tag "att:ci" "$RUNNER_TEMP/att-image"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' att:ci)" = '["/bin/sh","/opt/heocr-hf-entrypoint.sh"]'
      - name: Offline CPU smoke (no GPU on the runner)
        run: |
          docker run --rm --network none --entrypoint /opt/heocr-venv/bin/python att:ci \
            -c 'import heocr_compute.remote.hf_train_pod, huggingface_hub'
          if [[ "$TARGET" == att-parseq-train-cuda ]]; then
            docker run --rm --network none --entrypoint /bin/sh att:ci -c 'PYTHONPATH="$HEOCR_ATT_PARSEQ" "$HEOCR_ATT_PYTHON" -' <<'PY'
          import torch
          from strhub.data.utils import Tokenizer
          from strhub.models.parseq.model import PARSeq
          charset = "".join(chr(c) for c in range(0x05D0, 0x05EB)) + "0123456789"
          tok = Tokenizer(charset)
          m = PARSeq(num_tokens=len(tok), max_label_length=160, img_size=(32, 768), patch_size=(4, 16), embed_dim=384,
                     enc_num_heads=6, enc_mlp_ratio=4, enc_depth=12, dec_num_heads=12, dec_mlp_ratio=4, dec_depth=1,
                     decode_ar=True, refine_iters=1, dropout=0.1).eval()
          with torch.no_grad():
              out = m(tok, torch.zeros(1, 3, 32, 768), max_length=8)
          assert out.shape[0] == 1 and out.shape[-1] == len(tok) - 2, out.shape
          print("PARSeq CPU forward OK", tuple(out.shape))
          PY
          else
            # No GPU driver on the runner: import paddle may fail only on the driver's libcuda.so.1.
            docker run --rm --network none --entrypoint /bin/sh att:ci -c 'PYTHONPATH="$HEOCR_ATT_PADDLEOCR" "$HEOCR_ATT_PYTHON" -' <<'PY'
          import importlib.metadata as md
          assert md.version("paddlepaddle-gpu") == "3.2.2"
          try:
              import paddle
              print("paddle imported", paddle.__version__)
          except ImportError as e:
              assert "libcuda.so.1" in str(e), f"unexpected import failure: {e}"
              print("paddle import needs only the GPU driver's libcuda.so.1, as expected on a CPU runner")
          PY
          fi
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push and pin by digest
        id: push
        run: |
          tag="$IMAGE:$TARGET-sha-$GITHUB_SHA"
          docker tag att:ci "$tag"
          docker push "$tag"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag" | sed 's/.*@//')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          printf '%s image: `%s@%s`\n' "$TARGET" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the worker pulls anonymously
        env:
          PUBLISHED_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          config="$(mktemp -d)"
          printf '{}\n' > "$config/config.json"
          docker --config "$config" pull --platform linux/amd64 "$PUBLISHED_IMAGE"
